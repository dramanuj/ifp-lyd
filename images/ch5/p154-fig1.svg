<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>Church wall paintings</title><desc>Inside a medieval church, tall white vaults and arches frame painted panels of Bible-story scenes: a boat on waves, a star over a stable and a tree with a serpent, lit by coloured window light.</desc><defs><style>.o{stroke:#1b0a3c;stroke-linejoin:round;stroke-linecap:round}@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinr{to{transform:rotate(-360deg)}}@keyframes tw{0%,100%{opacity:.3}50%{opacity:1}}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}@keyframes sw{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}@keyframes dr{0%{transform:translateX(-50px)}100%{transform:translateX(70px)}}@keyframes fl{0%,100%{transform:skewY(-4deg) scaleX(1)}50%{transform:skewY(4deg) scaleX(.96)}}@keyframes fk{0%,100%{transform:scale(1,1)}50%{transform:scale(.94,1.1)}}@keyframes wv{to{transform:translateX(calc(var(--dx) * -1))}}@keyframes wvr{from{transform:translateX(calc(var(--dx) * -1))}to{transform:none}}@keyframes ri{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(var(--dy));opacity:0}}@keyframes dp{0%{transform:translateY(-70px);opacity:0}25%,70%{opacity:1}100%{transform:translateY(40px);opacity:0}}@keyframes fa{0%{transform:translate(0,-60px);opacity:0}20%{opacity:1}100%{transform:translate(60px,520px);opacity:0}}@keyframes kb{0%{transform:scale(1)}100%{transform:scale(1.045)}}@keyframes zg{0%,100%{transform:translateX(-26px)}50%{transform:translateX(26px)}}@keyframes fy{0%{transform:translateX(-300px)}100%{transform:translateX(300px)}}@keyframes bm{0%,100%{opacity:.35}50%{opacity:.8}}.spin{animation:spin var(--t,60s) linear infinite}.spinr{animation:spinr var(--t,60s) linear infinite}.tw{animation:tw var(--t,3s) ease-in-out infinite}.pulse{animation:pu var(--t,5s) ease-in-out infinite}.bob{animation:bob var(--t,5s) ease-in-out infinite}.sway{animation:sw var(--t,6s) ease-in-out infinite}.drift{animation:dr var(--t,40s) ease-in-out infinite alternate}.flag{animation:fl var(--t,3.5s) ease-in-out infinite}.flick{animation:fk var(--t,2.4s) ease-in-out infinite}.wv{animation:wv var(--t,9s) linear infinite}.wvr{animation:wvr var(--t,11s) linear infinite}.rise{animation:ri var(--t,4s) ease-out infinite}.drop{animation:dp var(--t,4s) ease-in-out infinite}.fall{animation:fa var(--t,7s) linear infinite}.kb{animation:kb 24s ease-in-out infinite alternate;transform-origin:800px 450px}.zig{animation:zg var(--t,8s) ease-in-out infinite}.fly{animation:fy var(--t,14s) ease-in-out infinite alternate}.beam{animation:bm var(--t,6s) ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><linearGradient id="s1" gradientTransform="rotate(90 .5 .5)"><stop offset="0" stop-color="#0c0426"/><stop offset="0.6" stop-color="#2B1478"/><stop offset="1" stop-color="#4a22b8"/></linearGradient><pattern id="h2" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(28)"><circle cx="11.0" cy="11.0" r="5.720000000000001" fill="#1b0a3c" fill-opacity="0.3"/></pattern><mask id="m_b" maskContentUnits="objectBoundingBox" x="0" y="0" width="1" height="1"><linearGradient id="g_b" x1="0" y1="0" x2="0" y2="1"><stop offset=".25" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient><rect width="1" height="1" fill="url(#g_b)"/></mask><pattern id="h5" width="15" height="15" patternUnits="userSpaceOnUse" patternTransform="rotate(28)"><circle cx="7.5" cy="7.5" r="3.6" fill="#1b0a3c" fill-opacity="0.34"/></pattern><mask id="m_br" maskContentUnits="objectBoundingBox" x="0" y="0" width="1" height="1"><linearGradient id="g_br" x1="0" y1="0" x2="1" y2="1"><stop offset=".25" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient><rect width="1" height="1" fill="url(#g_br)"/></mask><pattern id="h7" width="15" height="15" patternUnits