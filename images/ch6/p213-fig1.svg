<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>The Earth has an inner core</title><desc>A cutaway Earth with a glowing white inner core inside gold and orange layers, seismic wave rings spreading outwards, and a seismograph paper with a zigzag trace beside it.</desc><defs><style>.o{stroke:#1b0a3c;stroke-linejoin:round;stroke-linecap:round}@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinr{to{transform:rotate(-360deg)}}@keyframes tw{0%,100%{opacity:.3}50%{opacity:1}}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}@keyframes sw{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}@keyframes dr{0%{transform:translateX(-50px)}100%{transform:translateX(70px)}}@keyframes fl{0%,100%{transform:skewY(-4deg) scaleX(1)}50%{transform:skewY(4deg) scaleX(.96)}}@keyframes fk{0%,100%{transform:scale(1,1)}50%{transform:scale(.94,1.1)}}@keyframes wv{to{transform:translateX(calc(var(--dx) * -1))}}@keyframes wvr{from{transform:translateX(calc(var(--dx) * -1))}to{transform:none}}@keyframes ri{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(var(--dy));opacity:0}}@keyframes dp{0%{transform:translateY(-70px);opacity:0}25%,70%{opacity:1}100%{transform:translateY(40px);opacity:0}}@keyframes fa{0%{transform:translate(0,-60px);opacity:0}20%{opacity:1}100%{transform:translate(60px,520px);opacity:0}}@keyframes kb{0%{transform:scale(1)}100%{transform:scale(1.045)}}@keyframes zg{0%,100%{transform:translateX(-26px)}50%{transform:translateX(26px)}}@keyframes fy{0%{transform:translateX(-300px)}100%{transform:translateX(300px)}}@keyframes bm{0%,100%{opacity:.35}50%{opacity:.8}}.spin{animation:spin var(--t,60s) linear infinite}.spinr{animation:spinr var(--t,60s) linear infinite}.tw{animation:tw var(--t,3s) ease-in-out infinite}.pulse{animation:pu var(--t,5s) ease-in-out infinite}.bob{animation:bob var(--t,5s) ease-in-out 