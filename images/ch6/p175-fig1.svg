nite}.sway{animation:sw var(--t,6s) ease-in-out infinite}.drift{animation:dr var(--t,40s) ease-in-out infinite alternate}.flag{animation:fl var(--t,3.5s) ease-in-out infinite}.flick{animation:fk var(--t,2.4s) ease-in-out infinite}.wv{animation:wv var(--t,9s) linear infinite}.wvr{animation:wvr var(--t,11s) linear infinite}.rise{animation:ri var(--t,4s) ease-out infinite}.drop{animation:dp var(--t,4s) ease-in-out infinite}.fall{animation:fa var(--t,7s) linear infinite}.kb{animation:kb 24s ease-in-out infinite alternate;transform-origin:800px 450px}.zig{animation:zg var(--t,8s) ease-in-out infinite}.fly{animation:fy var(--t,14s) ease-in-out infinite alternate}.beam{animation:bm var(--t,6s) ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><linearGradient id="s1" gradientTransform="rotate(90 .5 .5)"><stop offset="0" stop-color="#160840"/><stop offset="0.4" stop-color="#2459FF"/><stop offset="1" stop-color="#13D6F2"/></linearGradient><pattern id="h2" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(28)"><circle cx="11.0" cy="11.0" r="5.720000000000001" fill="#fff" fill-opacity="0.35"/></pattern><mask id="m_b" maskContentUnits="objectBoundingBox" x="0" y="0" width="1" height="1"><linearGradient id="g_b" x1="0" y1="0" x2="0" y2="1"><stop offset=".25" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient><rect width="1" height="1" fill="url(#g_b)"/></mask><pattern id="h5" width="15" height="15" patternUnits="userSpaceOnUse" patternTransform="rotate(28)"><circle cx="7.5" cy="7.5" r="3.6" fill="#ffffff" fill-opacity="0.5"/></pattern><mask id="m_tl" maskContentUnits="objectBoundingBox" x="0" y="0" width="1" height="1"><linearGradient id="g_tl" x1="1" y1="1" x2="0" y2="0"><stop offset=".25" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient><rect width="1" height="1" fill="url(#g_tl)"/></mask><pattern id="h8" width="11" height="11" patternUnits="userSpaceOnUse" patt